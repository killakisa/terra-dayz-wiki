<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Оружие</title>

<style>
body {
    margin: 0;
    background: #0b0f0d;
    color: #fff;
    font-family: Arial;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
}

h1 {
    color: #9cff57;
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    background: #111;
    border: 1px solid #2b3a2f;
    border-radius: 8px;
    color: #fff;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th {
    background: #111;
    color: #9cff57;
    padding: 10px;
    text-align: left;
}

.table td {
    padding: 8px;
    border-bottom: 1px solid #1f2a22;
}

.table tr:hover {
    background: #1a1f1c;
}

.back {
    margin-bottom: 20px;
    cursor: pointer;
    color: #9cff57;
}
</style>
</head>

<body>

<div class="container">

<div class="back" onclick="goBack()">← Назад</div>

<h1>Оружие и урон</h1>

<input id="search" placeholder="Поиск оружия..." oninput="render()">

<table class="table">
<thead>
<tr>
<th>Оружие</th>
<th>Патрон</th>
<th>Урон</th>
<th>Магазин</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

</div>

<script>
let weapons = [];

async function loadCSV(file) {
    const text = await fetch(file).then(r => r.text());
    return parseCSV(text);
}

function goBack(){
    window.location.href = "index.html";
}

function parseCSV(text) {
    const rows = [];
    let row = [];
    let current = '';
    let insideQuotes = false;

    for (let char of text) {
        if (char === '"') insideQuotes = !insideQuotes;
        else if (char === ',' && !insideQuotes) {
            row.push(current.trim());
            current = '';
        }
        else if (char === '\n' && !insideQuotes) {
            row.push(current.trim());
            rows.push(row);
            row = [];
            current = '';
        }
        else current += char;
    }

    const headers = rows[0];

    return rows.slice(1).map(r => {
        let obj = {};
        headers.forEach((h, i) => {
            obj[h] = r[i];
        });
        return obj;
    });
}

function render(){

    const list = document.getElementById("list");
    const search = document.getElementById("search").value.toLowerCase();

    list.innerHTML = "";

    weapons.forEach(w => {

        if(w.Weapon.toLowerCase().includes(search)){

            list.innerHTML += `
            <tr>
                <td style="color:${getTierColor(w.Tier)}; font-weight:600">
                    ${w.Weapon}
                </td>
                <td>${w.Ammo}</td>
                <td>${colorDamage(w.Damage)}</td>
                <td>${w.Magazine}</td>
            </tr>
            `;
        }
    });
}

// 🔥 цвет урона
function colorDamage(d){

    if(d >= 2000) return `<span style="color:#ff4d4d">${d}</span>`; // 🔴 имба
    if(d >= 1000) return `<span style="color:#c77dff">${d}</span>`; // 🟣 топ
    if(d >= 300) return `<span style="color:#4da6ff">${d}</span>`; // 🔵 среднее

    return d;
}
function getTierColor(tier){

    const map = {
        "Common": "#aaa",
        "Uncommon": "#6cff57",
        "Rare": "#4da6ff",
        "Epic": "#c77dff",
        "Mythic": "#ff8c42",
        "Legendary": "#ffd700"
    };

    return map[tier] || "#fff";
}
render();
async function init() {
    weapons = await loadCSV("WEAPONS.csv");
    render();
}

window.onload = init;
</script>

</body>
</html>
