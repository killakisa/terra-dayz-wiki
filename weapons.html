<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Оружие</title>

<style>
body {
    margin:0;
    background:#0b0f0d;
    color:#fff;
    font-family:Arial;
}

.container{
    max-width:1000px;
    margin:40px auto;
}

h1{
    color:#9cff57;
    text-align:center;
}

/* фильтры */
.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input, select{
    padding:8px;
    background:#111;
    border:1px solid #2b3a2f;
    border-radius:6px;
    color:#fff;
}

/* карточки */
.card{
    display:flex;
    gap:15px;
    padding:15px;
    border:1px solid #1f2a22;
    border-radius:10px;
    margin-bottom:10px;
    background:#0f1512;
    transition:0.2s;
}

.card:hover{
    background:#16201b;
    transform:scale(1.01);
}

.weapon-name{
    font-size:16px;
    font-weight:700;
}

.stat{
    font-size:13px;
    color:#aaa;
}

/* урон */
.damage{
    font-weight:700;
}

.back{
    color:#9cff57;
    cursor:pointer;
    margin-bottom:20px;
    font-size:14px;
    text-align:left;
}

.back:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">
<div class="back" onclick="goBack()">← Назад</div>
    
<h1>Оружие и урон</h1>

<div class="filters">
    <input id="search" placeholder="Поиск..." oninput="render()">

    <select id="tier" onchange="render()">
        <option value="">Все tier</option>
        <option>guardian</option>
        <option>stalwart</option>
        <option>color</option>
        <option>legend</option>
    </select>

    <input id="ammo" placeholder="Патрон..." oninput="render()">

    <input type="number" id="dmg" placeholder="Мин. урон" oninput="render()">
</div>

<div id="list"></div>

</div>

<script>

let weapons = [];

async function loadCSV(file){
    const text = await fetch(file).then(r=>r.text());
    return parseCSV(text);
}

function parseCSV(text){
    const rows = text.split("\n").map(r=>r.split(","));
    const headers = rows[0];

    return rows.slice(1).map(r=>{
        let obj={};
        headers.forEach((h,i)=>obj[h]=r[i]);
        return obj;
    });
}

function getTierColor(name){
    if(!name) return "#fff";
    name = name.toLowerCase();

    if(name.includes("guardian")) return "#4da6ff";
    if(name.includes("stalwart")) return "#c77dff";
    if(name.includes("color")) return "#ff8c42";
    if(name.includes("legend")) return "#ffd700";

    return "#aaa";
}

function cleanName(name){
    return name
        .replace(/guardian/gi,"")
        .replace(/stalwart/gi,"")
        .replace(/color/gi,"")
        .replace(/legend/gi,"")
        .trim();
}

function render(){

    const list = document.getElementById("list");

    const search = document.getElementById("search").value.toLowerCase();
    const tier = document.getElementById("tier").value.toLowerCase();
    const ammo = document.getElementById("ammo").value.toLowerCase();
    const dmg = Number(document.getElementById("dmg").value || 0);

    list.innerHTML = "";

    weapons.forEach(w=>{

        const name = w.Weapon || "";
        const a = w.Ammo || "";
        const d = Number(w.Damage || 0);

        if(search && !name.toLowerCase().includes(search)) return;
        if(tier && !name.toLowerCase().includes(tier)) return;
        if(ammo && !a.toLowerCase().includes(ammo)) return;
        if(d < dmg) return;

        list.innerHTML += `
        <div class="card">

            <div>
                <div class="weapon-name"
                    style="color:${getTierColor(name)};
                    text-shadow:0 0 6px ${getTierColor(name)}">
                    ${cleanName(name)}
                </div>

                <div class="stat">Патрон: ${a.replace("Ammo_","")}</div>
                <div class="stat damage">Урон: ${d}</div>
                <div class="stat">Магазин: ${w.Magazine}</div>
            </div>

        </div>
        `;
    });
}
function goBack(){
    window.location.href = "index.html";
}
async function init(){
    weapons = await loadCSV("data/WEAPONS.csv");
    render();
}

init();

</script>

</body>
</html>
