<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Terra DayZ Wiki</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Terra DayZ Wiki',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        noData: {'/ru/': 'Ничего не найдено','/en/': 'No results'},
        paths: 'auto',
        placeholder: {'/ru/': 'Поиск…','/en/': 'Search…'}
      },
      alias: {
        '/ru/.*/_sidebar.md': '/ru/_sidebar.md',
        '/en/.*/_sidebar.md': '/en/_sidebar.md'
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
