<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сканеры</title>

<style>
body {
    margin: 0;
    background: #0b0f0d;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: 40px auto;
}

/* верхняя панель */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

/* кнопка назад */
.back {
    cursor: pointer;
    color: #9cff57;
}

/* заголовок */
h1 {
    text-align: center;
    color: #9cff57;
    margin-bottom: 20px;
}

/* поиск */
input {
    width: 100%;
    padding: 10px;
    background: #111;
    border: 1px solid #2b3a2f;
    border-radius: 8px;
    color: #fff;
    margin-bottom: 20px;
}

/* карточки сканеров */
.card {
    background: linear-gradient(145deg, #111, #1a1f1c);
    border: 1px solid #2b3a2f;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    border-color: #9cff57;
    box-shadow: 0 0 10px rgba(156,255,87,0.3);
}

/* блок деталей */
.detail {
    margin-top: 25px;
    padding: 15px;
    background: #111;
    border-radius: 10px;
    border: 1px solid #2b3a2f;
}

/* кнопки */
.buttons {
    margin: 10px 0;
}

button {
    margin-right: 10px;
    padding: 8px 12px;
    background: #1a1f1c;
    border: 1px solid #2b3a2f;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    border-color: #9cff57;
}

/* карточки мутантов */
.mob {
    display: flex;
    align-items: center;
    background: #151a17;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.mob-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 12px;
    border: 2px solid #2b3a2f;
}

.mob-content {
    flex: 1;
}

.mob-title {
    font-weight: bold;
}

.mob-loc {
    font-size: 13px;
    color: gray;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <div class="back" onclick="goBack()">← Назад</div>
</div>

<h1>Сканеры</h1>


<div id="scannerList"></div>

<div id="detail" class="detail" style="display:none;">
    <h2 id="title"></h2>
    <p id="info"></p>

    <div class="buttons">
        <button onclick="showZombies()">Мутанты</button>
        <button onclick="showLoot()">Награды</button>
    </div>

    <div id="content"></div>
</div>

</div>

<script>
let loot = [];
let scanners = [];
let zombies = [];
let current = null;

let SERVER = "Deerisle";

function goBack(){
    window.location.href = "index.html";
}

// CSV парсер
function parseCSV(text) {
    const rows = [];
    let row = [];
    let current = '';
    let insideQuotes = false;

    for (let char of text) {
        if (char === '"') {
            insideQuotes = !insideQuotes;
        } 
        else if (char === ',' && !insideQuotes) {
            row.push(current.trim());
            current = '';
        } 
        else if (char === '\n' && !insideQuotes) {
            row.push(current.trim());
            rows.push(row);
            row = [];
            current = '';
        } 
        else {
            current += char;
        }
    }

    if (current) {
        row.push(current.trim());
        rows.push(row);
    }

    const headers = rows[0];

    return rows.slice(1).map(r => {
        let obj = {};
        headers.forEach((h, i) => {
            obj[h.replace(/"/g, "").trim()] = (r[i] || "").replace(/"/g, "").trim();
        });
        return obj;
    });
}

async function loadCSV(file) {
    const text = await fetch(file).then(r => r.text());
    return parseCSV(text);
}

async function init() {
    scanners = await loadCSV("SKAN-Scanners.csv");
    zombies = await loadCSV("SKAN-Zombies.csv");
    loot = await loadCSV("SKAN-Loot.csv");
    renderScanners();
}

// список
function renderScanners() {
    const list = document.getElementById("scannerList");

    list.innerHTML = "";

    scanners.forEach(s => {
        const name = s.ID;

        list.innerHTML += `
            <div class="card" onclick="openScanner('${name}')">
                Сканер ${name}
            </div>`;
    });
}

// открыть
function openScanner(id) {
    current = id;
    const s = scanners.find(x => x.ID == id);

    document.getElementById("detail").style.display = "block";
    document.getElementById("title").innerText = "Сканер " + id + " ур.";
    document.getElementById("info").innerText =
        "Время: " + s.ScanTime + " сек | Шанс: " + s.Chance + "%";

    document.getElementById("content").innerHTML = "";
}
function colorize(text) {
    if (!text) return "";

    return text
        .replace(/Данж/gi, "<span style='color:#ff4d4d; font-weight:600'>Данж</span>")
        .replace(/Нефтевышка|Oilrig/gi, "<span style='color:#c77dff; font-weight:600'>Нефтевышка</span>")
        .replace(/Активность/gi, "<span style='color:#4da6ff; font-weight:600'>Активность</span>");
}
// мутанты
function showZombies() {

    const locationField = "Location" + SERVER;

    const list = zombies.filter(z => 
        z.ID == current && z[locationField]
    );

    let html = "";

    list.forEach(z => {

    const name = z.ZombieNameRU || z.ZombieName || "???";
    const img = "images/" + (z.ZombieName || "").trim() + ".png";

        html += `
        <div class="mob">

            <img class="mob-img"
                 src="${img}"
                 onerror="this.onerror=null; this.src='images/default.png';">

            <div class="mob-content">

                <div class="mob-title">${name}</div>

                <div class="mob-loc">
                    ${z.LocationDeerisle ? "Deerisle: " + colorize(z.LocationDeerisle) + "<br>" : ""}
                    ${z.LocationCherno ? "Cherno: " + colorize(z.LocationCherno) + "<br>" : ""}
                    ${z.LocationFrostline ? "Frostline: " + colorize(z.LocationFrostline) : ""}
                </div>

            </div>

        </div>
        `;
    });

    document.getElementById("content").innerHTML = html || "Нет данных";
}
// лут
function showLoot() {

    const list = loot.filter(l => l.ID == current);

    let html = "<h3>Награды</h3>";

    if (list.length === 0) {
        html += "<div>Нет данных</div>";
    }

    list.forEach(l => {

        const name = l.ItemNameRU || l.ItemName || "???";
        let chance = l.DropChance || "";

        // 🔥 Boss подсветка
        if (chance.includes("Boss")) {
            chance = `<span style="color:#ff4d4d">${chance}</span>`;
        }

        html += `
        <div class="mob">
            <div class="mob-content">
                <div class="mob-title">${name}</div>
                <div class="mob-loc">Шанс: ${chance}%</div>
            </div>
        </div>
        `;
    });

    document.getElementById("content").innerHTML = html;
}
window.onload = init;

</script>

</body>
</html>
