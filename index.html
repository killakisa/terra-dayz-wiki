<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Terra Wiki</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #0f1a14, #070a08);
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: 80px auto;
    text-align: center;
    padding: 0 16px;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
    color: #9cff57;
    letter-spacing: 2px;
}

.subtitle {
    color: #777;
    margin-bottom: 20px;
}

/* 🔥 ПОИСК */
#search {
    width: 350px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2b3a2f;
    background: #0f1512;
    color: #fff;
    outline: none;
    margin-bottom: 20px;
}

#search:focus {
    border-color:#9cff57;
    box-shadow:0 0 10px rgba(156,255,87,0.3);
}


.search-box{
    position: relative;
    width: 350px;
    margin: auto;
}

/* контейнер результатов */
#results{
    position: absolute;
    top: 105%;
    left: 0;
    width: 100%;
    background: linear-gradient(145deg, #0f1512, #0b0f0d);
    border: 1px solid #2b3a2f;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    overflow: hidden;
    z-index: 10;
}

/* элемент результата */
.result{
    padding: 12px 14px;
    cursor: pointer;
    transition: 0.2s;
    border-bottom: 1px solid #1a241d;
}

/* последний без линии */
.result:last-child{
    border-bottom: none;
}

/* hover */
.result:hover{
    background: linear-gradient(90deg, #1a2a22, #0f1512);
    color: #9cff57;
}

/* скрытие если пусто */
#results:empty{
    display: none;
}

/* карточки */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    align-items: stretch;
}

.card {
    background: linear-gradient(145deg, #111, #1a1f1c);
    border: 1px solid #2b3a2f;
    padding: 20px;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.25s;
    text-align: left;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #9cff57;
    box-shadow: 0 0 20px rgba(156,255,87,0.35);
}

.card-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.card-desc {
    font-size: 13px;
    color: #888;
}

.footer {
    margin-top: 60px;
    font-size: 12px;
    color: #444;
}
</style>
</head>

<body>

<div class="container">

<h1>TERRA WIKI</h1>
<div class="subtitle">Информация по серверу Terra DayZ</div>

<!-- 🔥 ПОИСК -->

<div class="search-box">
    <input id="search" placeholder="Поиск по вики...">
    <div id="results"></div>
</div>

<div class="cards" id="cards"></div>

<div class="footer">
Terra DayZ Wiki
</div>

</div>

<script>
function go(page){
    window.location.href = page;
}

/* 🔥 ДАННЫЕ ДЛЯ ПОИСКА */
const DATA = [
  { title:"Сканер мутаций", url:"scanners.html", desc:"Мутанты, локации и награды", tags:"мутанты зомби сканер" },
  { title:"Оружие и урон", url:"weapons.html", desc:"Характеристики оружия и урон", tags:"оружие урон ammo gun" },
  { title:"Добыча руды", url:"mining.html", desc:"Где искать и как перерабатывать", tags:"руда mining ресурсы" },
  { title:"Легендарное оружие", url:"weapon-trade.html", desc:"Где добывать чертежи", tags:"чертежи чертеж план планы plan a b c d e f обмен оружия легенда терра black trade boss босс данж активность нефтевышка oilrig cherno deerisle frostline zoo maya tungar prison urup skalisty" },
  { title:"Гифтбоксы", url:"giftboxes.html", desc:"Ежедневная рулетка, шансы и содержимое", tags:"гифтбокс giftbox ежедневная рулетка daily стандартный еда боеприпасы одежда коллекции инструменты оружейный легендарный шанс дроп предметы" },
  { title:"Консервация мяса", url:"meat-canning.html", desc:"Полевая кухня, рецепты и заготовка банок", tags:"консервация консервы мясо полевая кухня набор для сборки мясорубка кастрюля книга рецептов перчатки пустая банка лист металла ножовка" },
  { title:"Система начисления репутации", url:"reputation.html", desc:"Начисления, штрафы и уровни репутации", tags:"репутация система начисления уровни 10k 20k 30k 40k 50k боты зомби солдат медведь игрок группировки" },
  { title:"Медицина", url:"medicine.html", desc:"Аптечки, бинты и медпредметы", tags:"медицина аптечка красная желтая синяя бинт военный медицинский клей бф-6 хилки промедол кровь порезы" },
  { title:"Детекторы и магнитные поля", url:"detectors.html", desc:"Как работают детекторы, зоны и советы", tags:"детекторы магнитные поля артефакты сканирование батареи крафт побочные эффекты искорка deer isle chernarus frostline" },
  { title:"Свойства артефактов", url:"artifacts.html", desc:"Плюсы и минусы артефактов по группам", tags:"артефакты свойства детектор detector scanner stag кровь здоровье еда вода порезы шок плюс минус ангел снежинка огненный шар оазис" }
];

const SORTED_DATA = [...DATA].sort((a, b) =>
    a.title.localeCompare(b.title, "ru")
);

function renderCards(){
    const cards = document.getElementById("cards");
    cards.innerHTML = "";

    SORTED_DATA.forEach(item => {
        cards.innerHTML += `
            <div class="card" onclick="go('${item.url}')">
                <div class="card-title">${item.title}</div>
                <div class="card-desc">${item.desc || ""}</div>
            </div>
        `;
    });
}

/* 🔥 ПОИСК */
document.getElementById("search").addEventListener("input", function(){

    let q = this.value.toLowerCase();
    let results = document.getElementById("results");

    results.innerHTML = "";

    if(q.length < 2) return;

    let filtered = SORTED_DATA.filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.tags.toLowerCase().includes(q)
    );

    filtered.forEach(item=>{
        let div = document.createElement("div");
        div.className = "result";
        div.innerText = item.title;
        div.onclick = ()=> window.location.href = item.url;
        results.appendChild(div);
    });

});

renderCards();
</script>

</body>
</html>
