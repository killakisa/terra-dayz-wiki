<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Гифтбоксы</title>

<style>
body {
    margin: 0;
    background: #0b0f0d;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 980px;
    margin: 40px auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.back {
    cursor: pointer;
    color: #9cff57;
}

h1 {
    text-align: center;
    color: #9cff57;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    color: #9aa39d;
    margin-bottom: 18px;
}

.detail {
    margin-top: 14px;
    padding: 15px;
    background: #111;
    border-radius: 10px;
    border: 1px solid #2b3a2f;
}

.box-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
    margin-top: 12px;
}

.card {
    background: linear-gradient(145deg, #111, #1a1f1c);
    border: 1px solid #2b3a2f;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover,
.card.active {
    border-color: #9cff57;
    box-shadow: 0 0 10px rgba(156,255,87,0.3);
}

.card-title {
    font-weight: bold;
    margin-bottom: 6px;
}

.card-chance {
    color: #9cff57;
    font-size: 13px;
}

.card-desc {
    color: #8b8f8d;
    font-size: 13px;
    margin-top: 6px;
}

.mob {
    display: flex;
    align-items: center;
    background: #151a17;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.mob-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin-right: 12px;
    border: 2px solid #2b3a2f;
    background: #0f1512;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.mob-content {
    flex: 1;
}

.mob-title {
    font-weight: bold;
}

.mob-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.labels {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid transparent;
}

.label-collectible {
    color: #c77dff;
    background: rgba(199, 125, 255, 0.14);
    border-color: rgba(199, 125, 255, 0.5);
}

.label-quest {
    color: #4da6ff;
    background: rgba(77, 166, 255, 0.14);
    border-color: rgba(77, 166, 255, 0.5);
}

.label-crafting {
    color: #ffb86b;
    background: rgba(255, 184, 107, 0.14);
    border-color: rgba(255, 184, 107, 0.5);
}

.mob-loc {
    font-size: 13px;
    color: #9aa39d;
}

.empty {
    color: #7f8a84;
    font-size: 13px;
}
</style>
</head>
<body>

<div class="container">
    <div class="topbar">
        <div class="back" onclick="goBack()">← Назад</div>
    </div>

    <h1>Гифтбоксы</h1>
    <div class="subtitle">Подарочные коробки из ежедневной рулетки на сайте</div>

    <div class="detail">
        🎁 Каждый день можно получить случайный гифтбокс в ежедневной рулетке. Чем ценнее бокс, тем реже он выпадает.
    </div>

    <div class="detail">
        <h2>Шансы выпадения</h2>
        <div id="boxList" class="box-grid"></div>
    </div>

    <div id="boxDetail" class="detail" style="display:none;">
        <h2 id="boxTitle"></h2>
        <p id="boxInfo"></p>
        <div id="items"></div>
    </div>
</div>

<script>
let boxTypes = [];
let boxItems = [];
let currentBoxId = null;

function goBack() {
    window.location.href = "index.html";
}

function parseCSV(text) {
    const rows = [];
    let row = [];
    let current = "";
    let insideQuotes = false;

    for (let char of text) {
        if (char === '"') {
            insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
            row.push(current.trim());
            current = "";
        } else if (char === "\n" && !insideQuotes) {
            row.push(current.trim());
            rows.push(row);
            row = [];
            current = "";
        } else if (char !== "\r") {
            current += char;
        }
    }

    if (current) {
        row.push(current.trim());
        rows.push(row);
    }

    const headers = rows[0] || [];

    return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => {
            obj[h.replace(/"/g, "").trim()] = (r[i] || "").replace(/"/g, "").trim();
        });
        return obj;
    });
}

async function loadCSV(file) {
    const text = await fetch(file).then(r => r.text());
    return parseCSV(text);
}

function renderBoxes() {
    const list = document.getElementById("boxList");
    list.innerHTML = "";

    boxTypes
        .sort((a, b) => chanceScore(b.chance) - chanceScore(a.chance))
        .forEach(box => {
            const active = box.id === currentBoxId ? " active" : "";
            list.innerHTML += `
                <div class="card${active}" onclick="openBox('${box.id}')">
                    <div class="card-title">${box.icon || "🎁"} ${box.title}</div>
                    <div class="card-chance">Шанс бокса: ${formatChance(box.chance)}</div>
                    <div class="card-desc">${box.description || ""}</div>
                </div>
            `;
        });
}

function openBox(id) {
    currentBoxId = id;
    renderBoxes();

    const box = boxTypes.find(x => x.id === id);
    if (!box) return;

    document.getElementById("boxDetail").style.display = "block";
    document.getElementById("boxTitle").innerText = box.title;
    document.getElementById("boxInfo").innerText = `Шанс выпадения бокса: ${formatChance(box.chance)}`;

    const itemsWrap = document.getElementById("items");
    const list = boxItems
        .filter(i => i.box_id === id)
        .sort((a, b) => chanceScore(b.chance) - chanceScore(a.chance));

    if (!list.length) {
        itemsWrap.innerHTML = "<div class='empty'>Для этого бокса таблица предметов пока не добавлена.</div>";
        return;
    }

    itemsWrap.innerHTML = "";
    list.forEach(item => {
        const labelsHtml = renderLabels(item.item, item.labels);
        itemsWrap.innerHTML += `
            <div class="mob">
                <div class="mob-icon">${box.icon || "🎁"}</div>
                <div class="mob-content">
                    <div class="mob-title-row">
                        <div class="mob-title">${item.item}</div>
                        ${labelsHtml}
                    </div>
                    <div class="mob-loc">Шанс предмета: ${formatChance(item.chance)}</div>
                </div>
            </div>
        `;
    });
}

function chanceScore(value) {
    const text = String(value || "").trim();
    const ratio = text.match(/^(\d+)\s*к\s*(\d+)$/i);
    if (ratio) {
        const a = Number(ratio[1]);
        const b = Number(ratio[2]);
        return b ? (a / b) * 100 : 0;
    }

    const numeric = Number(text);
    return Number.isFinite(numeric) ? numeric : 0;
}

function formatChance(value) {
    const text = String(value || "").trim();
    if (!text) return "-";
    if (/^\d+(\.\d+)?$/.test(text)) return `${text}%`;
    return text;
}

function getLootLabels(itemName, explicitLabels) {
    if (!explicitLabels) return [];

    return String(explicitLabels)
        .split(/[;,]/)
        .map(x => x.trim().toLowerCase())
        .filter(Boolean);
}

function renderLabels(itemName, explicitLabels) {
    const labels = getLootLabels(itemName, explicitLabels);
    if (!labels.length) return "";

    return `
        <div class="labels">
            ${labels.map(label => {
                if (label === "коллекционный") return "<span class='label label-collectible'>Коллекционный</span>";
                if (label === "квестовый") return "<span class='label label-quest'>Квестовый</span>";
                if (label === "крафт ингредиент") return "<span class='label label-crafting'>Крафт ингредиент</span>";
                return "";
            }).join("")}
        </div>
    `;
}

async function init() {
    boxTypes = await loadCSV("data/GIFTBOXES-TYPES.csv");
    boxItems = await loadCSV("data/GIFTBOXES-ITEMS.csv");
    currentBoxId = "standard";
    renderBoxes();
    openBox(currentBoxId);
}

window.onload = init;
</script>
</body>
</html>
