<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Terra Wiki</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #0f1a14, #070a08);
    color: #fff;
    font-family: Arial, sans-serif;
}

/* контейнер */
.container {
    max-width: 900px;
    margin: 80px auto;
    text-align: center;
}

/* заголовок */
h1 {
    font-size: 42px;
    margin-bottom: 10px;
    color: #9cff57;
    letter-spacing: 2px;
}

/* подзаголовок */
.subtitle {
    color: #777;
    margin-bottom: 40px;
}

/* блок кнопок */
.cards {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

/* карточка */
.card {
    background: linear-gradient(145deg, #111, #1a1f1c);
    border: 1px solid #2b3a2f;
    padding: 20px;
    width: 320px;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.25s;
    text-align: left;
}

/* hover */
.card:hover {
    transform: scale(1.05);
    border-color: #9cff57;
    box-shadow: 0 0 20px rgba(156,255,87,0.35);
}

/* название */
.card-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

/* описание */
.card-desc {
    font-size: 13px;
    color: #888;
}

/* футер */
.footer {
    margin-top: 60px;
    font-size: 12px;
    color: #444;
}
</style>
</head>

<body>

<div class="container">

<h1>TERRA WIKI</h1>
<div class="subtitle">Информация по серверу Terra DayZ</div>

<div class="cards">

<div class="card" onclick="go('scanners.html')">
    <div class="card-title">Сканер мутаций</div>
    <div class="card-desc">Мутанты, локации и награды</div>
</div>

<div class="card" onclick="go('weapons.html')">
    <div class="card-title">Оружие и урон</div>
    <div class="card-desc">Характеристики оружия и урон</div>
</div>

<div class="card" onclick="go('mining.html')">
    <div class="card-title">Добыча руды</div>
    <div class="card-desc">Где искать и как перерабатывать</div>
</div>

</div>

<div class="footer">
Terra DayZ Wiki
</div>

</div>

<script>
function go(page){
    window.location.href = page;
}
</script>

</body>
</html>
